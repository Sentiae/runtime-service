syntax = "proto3";

package runtime.v1;

option go_package = "github.com/sentiae/runtime-service/gen/proto/runtime/v1;runtimev1";

// guestsecrets.proto is an INTERNAL host<->guest wire, NOT a mesh/service
// contract. It frames the secret bundle the host pushes to a booting microVM
// over vsock (invariant I32: a secret's plaintext exists only in the owning
// guest's memory — delivered host->guest over vsock into a tmpfs-0600 file,
// never on the host rootfs, logs, or mesh). No service exposes these messages.

// SecretItem is one named secret delivered to the guest.
message SecretItem {
    string name = 1;
    // value is the secret plaintext. GUEST-ONLY: it is delivered over the
    // host->guest vsock channel straight into guest RAM (tmpfs, mode 0600) and
    // is NEVER persisted host-side (no rootfs, no logs, no mesh, no DB).
    string value = 2;
}

// SecretBundle is the full set of secrets pushed to one guest at boot.
message SecretBundle {
    repeated SecretItem items = 1;
    // bootstrap_nonce authenticates the pusher to the guest (invariant I32,
    // D-085 Layer 2). The host mints a per-boot, cryptographically-random nonce,
    // writes it into the guest's runtime.json, and echoes it here; the guest
    // accepts the bundle only when this matches its expected nonce, defeating a
    // host-side spoof/replay of the secret push. It is NOT a secret (it protects
    // integrity of the pusher's identity, not confidentiality) but MUST be
    // per-boot fresh and unpredictable. Empty when the boot expects no secrets.
    string bootstrap_nonce = 2;
}

// Ack is the guest's reply after it has written the bundle to its tmpfs.
message Ack {
    bool ok = 1;
    string error = 2;
}
