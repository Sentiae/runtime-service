syntax = "proto3";

package runtime.v1;

option go_package = "github.com/sentiae/runtime-service/gen/proto/runtime/v1;runtimev1";

// FleetOrchestration is the P7 DeployTarget provider seam (docs/program/02-pillars/runtime-fleet/README.md §4).
// CP3 implements Provision/Health/Decommission for workload classes "test" and "resident";
// Scale lands with the CP4 fleet control plane and returns Unimplemented until then.
service FleetOrchestration {
    rpc Provision(ProvisionRequest) returns (ProvisionResponse);
    rpc Health(FleetHealthRequest) returns (FleetHealthResponse);
    rpc Scale(FleetScaleRequest) returns (FleetScaleResponse);
    rpc Decommission(FleetDecommissionRequest) returns (FleetDecommissionResponse);

    // CP4 fleet control plane — host registry + inventory + heartbeat (§9#4).
    rpc RegisterHost(RegisterHostRequest) returns (RegisterHostResponse);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
    rpc ListHosts(ListHostsRequest) returns (ListHostsResponse);
}

message OCIImageRef {
    string registry = 1;   // e.g. "10.0.10.20:8089"
    string repository = 2; // e.g. "org/component"
    string digest = 3;     // "sha256:..."
    string change_id = 4;  // provenance (D-016); informational here
}
message ResourceSpec { int32 vcpu = 1; int32 memory_mb = 2; }
message RouteSpec { string host_pattern = 1; string path_prefix = 2; }   // unused in CP3, shape frozen
message VolumeSpec { string id = 1; int32 size_mb = 2; }                 // unused in CP3, shape frozen
message DeploymentDescriptor {
    string component_id = 1;
    string env = 2;
    OCIImageRef image = 3;
    ResourceSpec resources = 4;          // 0 values → defaults (1 vcpu, 512 MB)
    map<string, string> env_vars = 5;
    repeated string secret_refs = 6;     // resident class: tenant-namespaced refs ("tenants/<org-uuid>/<subpath>#<field>") resolved per-tenant at boot (P14/I32); test class rejects them
    repeated RouteSpec routes = 7;       // ignored in CP3
    repeated VolumeSpec volumes = 8;     // ignored in CP3
    int32 port = 9;                      // guest port the workload listens on (resident class)
    string workload_class = 10;          // "test" | "resident"
    string test_command = 11;            // test class only: overrides the image entrypoint when non-empty (run via /bin/sh -c)
    int64 timeout_seconds = 12;          // test class: max run time (default 300)
    // Scale-to-zero (rt#11, D-082). 0-defaults preserve today's behavior.
    bool scale_to_zero = 13;             // resident class: allow the fleet to drain to zero replicas when idle
    int32 idle_ttl_seconds = 14;         // resident class: seconds of inactivity before scale-to-zero (0 disables)
    int32 min_replicas = 15;             // resident class: floor replica count (default 0)
    int32 max_replicas = 16;             // resident class: ceiling replica count (0 → default 1)
    // D-125 (executes D-089): the per-deployment Vault secret-broker token
    // minted by delivery, scoped to owner_org's `secret-tenant-<org>` policy and
    // handed to the fleet host. The fleet BEARS it (renews for the deployment
    // lifetime, revokes on Decommission) and NEVER mints. Held memory/tmpfs-only
    // on the fleet — NEVER persisted to a row, rootfs, or log. Resident class
    // only; empty on the test leg.
    string vault_token = 17;
    // D-124: the per-deployment, org-scoped OCI registry PULL token minted by
    // delivery for owner_org (scoped to this image's repository) and handed to the
    // fleet host. The fleet presents it as the registry Basic password when
    // pulling the image, replacing the shared read-any-org service key. Held
    // memory-only on the fleet — NEVER persisted to a row, rootfs, or log. Resident
    // (fleet) class only; empty on the test leg and pre-cutover (the fleet then
    // falls back to the shared service key — back-compat).
    string registry_pull_token = 18;
}
message ProvisionRequest {
    DeploymentDescriptor descriptor = 1;
    // owner_org is the attested tenant (org uuid) that owns this deployment's
    // secrets (D-069). It is the verified anchor the fleet scopes every
    // secret_ref resolution to (I28): a resident replica's secrets resolve only
    // for this org's per-tenant KEK. Empty is allowed only when secret_refs is
    // empty; a secret-bearing resident deploy without owner_org fails closed.
    string owner_org = 7;
}
message ProvisionResponse { string handle = 1; string url = 2; } // url set for resident class ("http://<advertise_host>:<host_port>"), empty for test
message FleetHealthRequest { string handle = 1; }
message FleetHealthResponse {
    string state = 1;        // "booting" | "running" | "exited" | "failed"
    bool healthy = 2;        // resident: TCP dial guest port ok; test: state==exited && exit_code==0
    int32 exit_code = 3;     // meaningful when state=="exited"
    string message = 4;
    string stdout_tail = 5;  // last <=8KB, test class
    string stderr_tail = 6;
    string url = 7;
}
message FleetScaleRequest { string handle = 1; int32 replicas = 2; }
message FleetScaleResponse {}
message FleetDecommissionRequest { string handle = 1; }
message FleetDecommissionResponse {}

// ── CP4 host registry (§9#4) ──────────────────────────────────────────
message HostSpec {
    string host_id = 1;                // empty → registry assigns a uuid
    string region = 2;
    map<string, string> labels = 3;
    int32 capacity_vcpu = 4;
    int64 capacity_mem_mb = 5;
    int64 capacity_disk_mb = 6;
    string endpoint = 7;               // host:port the fleet dials
}
message RegisterHostRequest { HostSpec host = 1; }
message RegisterHostResponse { string host_id = 1; }
message HeartbeatRequest {
    string host_id = 1;
    int32 allocatable_vcpu = 2;
    int64 allocatable_mem_mb = 3;
    int64 allocatable_disk_mb = 4;
    string health = 5;                 // "healthy" | "degraded" | "unhealthy" | "unknown"
}
message HeartbeatResponse {}
message HostInfo {
    string host_id = 1;
    string region = 2;
    map<string, string> labels = 3;
    int32 capacity_vcpu = 4;
    int64 capacity_mem_mb = 5;
    int64 capacity_disk_mb = 6;
    int32 allocatable_vcpu = 7;
    int64 allocatable_mem_mb = 8;
    int64 allocatable_disk_mb = 9;
    string health = 10;
    string status = 11;                // "active" | "draining" | "cordoned" | "decommissioned"
    string endpoint = 12;
    int64 last_heartbeat_unix = 13;    // 0 when never heartbeated
}
message ListHostsRequest {}
message ListHostsResponse { repeated HostInfo hosts = 1; }
